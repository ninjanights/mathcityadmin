<div
  class="rounded-2xl bg-neutral-200 px-4 py-3 dark:bg-neutral-800"
>
  <div class="flex items-start justify-between gap-4">

    <div class="flex-1">

      <p class="font-semibold">
        {{ question().question }}
      </p>

      <div class="mt-2 flex items-center gap-3 text-sm text-neutral-500">

        <span>
          Difficulty:
          {{ difficultyLabel(question().difficulty) }}
        </span>

        <span>
          Order:
          {{ question().displayOrder }}
        </span>

      </div>

    </div>

    <div class="flex items-center gap-3">

      <button
        type="button"
        (click)="edit.emit(question())"
        class="text-sm text-neutral-500 transition hover:text-neutral-900 dark:hover:text-neutral-200"
      >
        Edit
      </button>

      <button
        type="button"
        (click)="delete.emit(question())"
        class="text-sm text-red-500 transition hover:text-red-400"
      >
        Delete
      </button>

      <div class="flex flex-col">
        <button type="button" (click)="moveUp.emit(question())" aria-label="Move question up" class="flex h-6 w-7 items-center justify-center text-neutral-500 transition hover:text-neutral-900 dark:hover:text-neutral-200">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6" /></svg>
        </button>
        <button type="button" (click)="moveDown.emit(question())" aria-label="Move question down" class="flex h-6 w-7 items-center justify-center text-neutral-500 transition hover:text-neutral-900 dark:hover:text-neutral-200">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4" aria-hidden="true"><path d="M12 5v14m6-6-6 6-6-6" /></svg>
        </button>
      </div>

    </div>

  </div>
</div>
