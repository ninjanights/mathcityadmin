<div
  class="rounded-xl border border-neutral-200 bg-white p-4 shadow-sm dark:border-neutral-800 dark:bg-neutral-900"
>
  <div class="flex items-start justify-between gap-4">

    <div class="flex-1">

      <p class="font-semibold">
        {{ question().question }}
      </p>

      <div class="mt-2 flex items-center gap-3 text-sm text-neutral-500">

        <span>
          Difficulty:
          {{ difficultyLabel(question().difficulty) }}
        </span>

        <span>
          Order:
          {{ question().displayOrder }}
        </span>

      </div>

    </div>

    <div class="flex gap-2">

      <button
        type="button"
        (click)="moveUp.emit(question())"
        class="rounded border px-2 py-1 text-sm"
      >
        ↑
      </button>

      <button
        type="button"
        (click)="moveDown.emit(question())"
        class="rounded border px-2 py-1 text-sm"
      >
        ↓
      </button>

      <button
        type="button"
        (click)="edit.emit(question())"
        class="rounded border px-3 py-1 text-sm"
      >
        Edit
      </button>

      <button
        type="button"
        (click)="delete.emit(question())"
        class="rounded border border-red-500 px-3 py-1 text-sm text-red-500"
      >
        Delete
      </button>

    </div>

  </div>
</div>
