<div class="flex flex-col gap-3">

  @for (question of practiceQuestions(); track question.id) {

    <app-practice-question-card
      [question]="question"
      (edit)="edit.emit($event)"
      (delete)="delete.emit($event)"
      (moveUp)="moveUp.emit($event)"
      (moveDown)="moveDown.emit($event)"
    />

  } @empty {

    <div
      class="rounded-xl border border-dashed border-neutral-300 p-10 text-center text-neutral-500 dark:border-neutral-700"
    >
      No practice questions found.
    </div>

  }

</div>
