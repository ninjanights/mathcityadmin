<div class="space-y-6">
  <!-- Header -->
  <app-practice-question-header
    (create)="onCreate()"
    (search)="onSearch($event)"
    (sort)="onSort($event)"
  />

  <!-- Subject Selector -->
  <app-horizontal-selector
    [items]="subjectItems()"
    [selectedId]="subjectStore.selectedSubject()?.id ?? ''"
    (selected)="onSubjectChange($event)"
  />

  <!-- Chapter Selector -->
  <app-horizontal-selector
    [items]="chapterItems()"
    [selectedId]="chapterStore.selectedChapter()?.id ?? ''"
    (selected)="onChapterChange($event)"
  />

  <!-- Topic Selector -->
  <app-horizontal-selector
    [items]="topicItems()"
    [selectedId]="topicStore.selectedTopic()?.id ?? ''"
    (selected)="onTopicChange($event)"
  />

  <!-- Lesson Selector -->
  @if (lessons().length > 0) {
    <app-horizontal-selector
      [items]="lessonItems()"
      [selectedId]="lessonStore.selectedLesson()?.id ?? ''"
      (selected)="onLessonSelected($event)"
    />
  }

  <!-- Practice Question Form -->
  @if (isCreating() || isEditing()) {
    <app-practice-question-form
      [question]="selectedPracticeQuestion() ?? undefined"
      [lessonId]="lessonStore.selectedLesson()?.id ?? ''"
      [saving]="saving()"
      (save)="onSave($event)"
      (cancel)="onCancel()"
    />
  } @else {
    <!-- Practice Question List -->

    <app-practice-question-list
      [practiceQuestions]="sortedPracticeQuestions()"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
      (moveUp)="onMove($event, 'Up')"
      (moveDown)="onMove($event, 'Down')"
    />

    <!-- Pagination -->

    @if (totalPages() > 1) {
      <div class="flex items-center justify-center gap-2 pt-6">
        @for (pageNumber of pageNumbers(); track pageNumber) {
          <button
            class="rounded-lg border px-3 py-2 transition"
            [class.bg-neutral-900]="pageNumber === page()"
            [class.text-white]="pageNumber === page()"
            (click)="onPageChange(pageNumber)"
          >
            {{ pageNumber }}
          </button>
        }
      </div>
    }
  }
</div>
