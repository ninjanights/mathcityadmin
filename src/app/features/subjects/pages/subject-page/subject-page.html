@if (isCreating() || isEditing()) {
  <app-subject-form
    [subject]="selectedSubject()"
    (save)="onSave($event)"
    (cancel)="onCancel()"
  ></app-subject-form>
} @else {
  @if (loading()) {
    <div class="flex items-center justify-center py-12">
      <p class="text-neutral-500 font-semibold animate-pulse dark:text-neutral-400">Loading Subjects...</p>
    </div>
  } @else {
    <div class="flex flex-col gap-2">
      <app-subject-header
        (create)="onCreate()"
        (search)="onSearch($event)"
        (sort)="onSort($event)"
      ></app-subject-header>

      <app-subject-list
        [subjects]="sortedSubjects()"
        [loading]="loading()"
        (edit)="onEdit($event)"
        (delete)="onDelete($event)"
        (publish)="onPublish($event)"
        (moveUp)="onMove($event, 'Up')"
        (moveDown)="onMove($event, 'Down')"
      ></app-subject-list>

      @if (totalPages() > 1) {
        <div class="flex items-center justify-between pt-2">
          <p class="text-xs text-neutral-500 dark:text-neutral-400">
            {{ totalCount() }} subject{{ totalCount() === 1 ? '' : 's' }} total
          </p>

          <div class="flex items-center gap-1">
            <button
              type="button"
              (click)="onPageChange(page() - 1)"
              [disabled]="page() <= 1"
              class="rounded-lg px-3 py-1.5 text-xs font-medium text-neutral-500 transition hover:bg-neutral-100 hover:text-neutral-900 disabled:pointer-events-none disabled:opacity-30 dark:hover:bg-[#313131] dark:hover:text-neutral-200"
            >
              Prev
            </button>

            @for (p of pageNumbers(); track p) {
              <button
                type="button"
                (click)="onPageChange(p)"
                [class]="
                  page() === p
                    ? 'rounded-lg px-3 py-1.5 text-xs font-semibold bg-neutral-900 text-white dark:bg-white dark:text-neutral-900'
                    : 'rounded-lg px-3 py-1.5 text-xs font-medium text-neutral-500 transition hover:bg-neutral-100 hover:text-neutral-900 dark:hover:bg-[#313131] dark:hover:text-neutral-200'
                "
              >
                {{ p }}
              </button>
            }

            <button
              type="button"
              (click)="onPageChange(page() + 1)"
              [disabled]="page() >= totalPages()"
              class="rounded-lg px-3 py-1.5 text-xs font-medium text-neutral-500 transition hover:bg-neutral-100 hover:text-neutral-900 disabled:pointer-events-none disabled:opacity-30 dark:hover:bg-[#313131] dark:hover:text-neutral-200"
            >
              Next
            </button>
          </div>
        </div>
      }
    </div>
  }
}
