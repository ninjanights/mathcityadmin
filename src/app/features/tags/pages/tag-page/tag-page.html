@if (isCreating() || isEditing()) {
  <app-tag-form
    [tag]="selectedTag()"
    (save)="onSave($event)"
    (cancel)="onCancel()"
  ></app-tag-form>
} @else {
  <div class="flex flex-col gap-2">
      <app-tag-header
        (create)="onCreate()"
        (search)="onSearch($event)"
        (sort)="onSort($event)"
      ></app-tag-header>

      @if (loading()) { <div class="flex min-h-40 items-center justify-center"><p class="font-semibold text-neutral-500 animate-pulse dark:text-neutral-400">Loading, please wait.</p></div> } @else {<app-tag-list
        [tags]="sortedTags()"
        (edit)="onEdit($event)"
        (delete)="onDelete($event)"
      ></app-tag-list>

      @if (totalPages() > 1) {
        <div class="flex items-center justify-between pt-1">
          <p class="text-xs text-neutral-500 dark:text-neutral-400">
            {{ totalCount() }} tag{{ totalCount() === 1 ? '' : 's' }} total
          </p>

          <div class="flex items-center gap-1">
            <button
              type="button"
              (click)="onPageChange(page() - 1)"
              [disabled]="page() <= 1"
              aria-label="Previous page"
              class="flex h-7 w-7 items-center justify-center rounded-full text-neutral-500 transition hover:bg-neutral-100 hover:text-neutral-900 disabled:pointer-events-none disabled:opacity-30 dark:hover:bg-[#313131] dark:hover:text-neutral-200"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="h-4 w-4" aria-hidden="true"><path d="m15 19-7-7 7-7" /></svg>
            </button>

            @for (pageNumber of pageNumbers(); track pageNumber) {
              <button
                type="button"
                (click)="onPageChange(pageNumber)"
                [class]="
                  pageNumber === page()
                    ? 'flex h-7 min-w-7 items-center justify-center rounded-full bg-[#9a7b78] px-2 text-xs font-semibold text-black'
                    : 'flex h-7 min-w-7 items-center justify-center rounded-full px-2 text-xs font-medium text-neutral-500 transition hover:bg-neutral-100 hover:text-neutral-900 dark:hover:bg-[#313131] dark:hover:text-neutral-200'
                "
              >
                {{ pageNumber }}
              </button>
            }

            <button
              type="button"
              (click)="onPageChange(page() + 1)"
              [disabled]="page() >= totalPages()"
              aria-label="Next page"
              class="flex h-7 w-7 items-center justify-center rounded-full text-neutral-500 transition hover:bg-neutral-100 hover:text-neutral-900 disabled:pointer-events-none disabled:opacity-30 dark:hover:bg-[#313131] dark:hover:text-neutral-200"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="h-4 w-4" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
            </button>
          </div>
        </div>
      }
    }
  </div>
}
