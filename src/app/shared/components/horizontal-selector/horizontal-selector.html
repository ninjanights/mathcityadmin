<div class="flex w-full items-center gap-2">

  <!-- Previous -->

  <button
    type="button"
    (click)="previous()"
    [disabled]="!canGoPrevious()"
    class="flex h-8 w-8 shrink-0 items-center justify-center text-neutral-500 transition hover:text-neutral-900 disabled:cursor-not-allowed disabled:opacity-40 dark:hover:text-white">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="h-4 w-4" aria-hidden="true">
      <path d="M19 12H5m6-6-6 6 6 6" />
    </svg>
  </button>

  <!-- Items -->

  <div class="flex flex-1 gap-2 overflow-hidden">

    @for(item of visibleItems(); track item.id){

      <button
        type="button"
        (click)="select(item)"
        [class]="
          selectedId() === item.id
            ? 'flex-1 rounded-full bg-[#9a7b78] px-4 py-1.5 whitespace-nowrap text-sm font-semibold text-black transition'
            : 'flex-1 rounded-full bg-neutral-100 px-4 py-1.5 whitespace-nowrap text-sm font-medium text-neutral-500 transition hover:bg-neutral-300 hover:text-neutral-900 dark:bg-[#313131] dark:text-neutral-400 dark:hover:bg-neutral-700 dark:hover:text-white'
        ">

        {{ item.label }}

      </button>

    }

  </div>

  <!-- Next -->

  <button
    type="button"
    (click)="next()"
    [disabled]="!canGoNext()"
    class="flex h-8 w-8 shrink-0 items-center justify-center text-neutral-500 transition hover:text-neutral-900 disabled:cursor-not-allowed disabled:opacity-40 dark:hover:text-white">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="h-4 w-4" aria-hidden="true">
      <path d="M5 12h14m-6-6 6 6-6 6" />
    </svg>
  </button>

</div>
